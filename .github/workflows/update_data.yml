name: Hoyo Vacancy Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_email_test:
        description: 'テストメールを送る（通知確認用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Validate email configuration
        run: |
          if [ -z "${{ secrets.EMAIL_USER }}" ] || [ -z "${{ secrets.EMAIL_PASSWORD }}" ] || [ -z "${{ secrets.ALERT_EMAIL }}" ]; then
            echo "Missing GitHub Actions secrets: EMAIL_USER, EMAIL_PASSWORD, ALERT_EMAIL"
            exit 1
          fi

      - name: Run Hoyo vacancy monitor
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_USER: ${{ secrets.EMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          FORCE_EMAIL_TEST: ${{ github.event.inputs.force_email_test || 'false' }}
        run: node scripts/hoyo_vacancy_scraper.mjs

      - name: Check for data changes
        id: changes
        run: |
          if git diff --quiet -- public/data/hakone_vacancy.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit JSON updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hakone_vacancy.json
          git commit -m "chore: update vacancy monitor snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Write summary
        run: |
          echo "## Vacancy monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
            echo "- Status: ✅ data updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: ℹ️ no change" >> "$GITHUB_STEP_SUMMARY"
          fi
